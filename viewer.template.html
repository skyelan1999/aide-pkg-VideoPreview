<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Preview</title><style>
:root{color-scheme:dark;--bg:#101722;--surface:#192333;--line:#2d3c51;--text:#e6edf6;--dim:#9eafc5;--accent:#6daaff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:14px}#format{color:var(--accent)}#status{font-size:12px;color:var(--dim);margin-left:auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:calc(100vh - 52px);min-height:400px}.main{padding:16px;overflow:auto}aside{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:14px}.screen{height:clamp(180px,38vh,420px);background:#06090f;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}video{width:100%;height:100%;object-fit:contain}#empty{padding:20px;color:var(--dim);text-align:center}h2{font-size:12px;letter-spacing:.03em;color:var(--dim);margin:18px 0 9px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:10px 0}button,select,input{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 9px}button,label.pick{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input[type=range]{accent-color:var(--accent);padding:0}#seek{width:100%}.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}small{color:var(--dim)}.pick{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px}input[type=file]{display:none}.metrics{display:flex;gap:18px;border-block:1px solid var(--line);padding:10px 0;margin-bottom:12px}.metrics b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.metrics span{color:var(--dim);font-size:11px}.media{width:100%;text-align:left;display:block;margin:6px 0;padding:8px;overflow-wrap:anywhere}.media small{display:block;font-size:10px}.track{margin:12px 0}.track-title{font-size:11px;color:var(--dim);margin-bottom:5px}.lane{display:flex;gap:4px;overflow:auto;min-height:36px;background:#0b111c;padding:4px;border-radius:5px}.clip{background:#25496e;border:1px solid #3b6791;border-radius:4px;min-width:110px;max-width:260px;padding:4px 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clip.audio{background:#264c46;border-color:#3f7467}.warning{color:#d4b681;background:#2b261d;padding:9px 11px;border-radius:6px;margin:8px 0;font-size:11px}#search{width:100%;margin:8px 0}#error{color:#ffc0ba;white-space:pre-wrap}#offset,#fps{width:72px}#details{white-space:pre-wrap;font-size:11px;color:var(--dim)}[hidden]{display:none!important}@media(max-width:780px){.layout{display:block;height:auto}aside{border-left:0;border-top:1px solid var(--line)}.screen{height:260px}}
</style><header><strong>VIDEO PREVIEW</strong><span id="format">工程与素材</span><span id="status" role="status">连接 Aide…</span></header><div class="layout"><main class="main"><div class="screen"><video id="video" playsinline controls hidden></video><div id="empty">选择工程素材或代理视频开始预览<br><small>工程结构预览不会执行剪辑软件的特效或脚本</small></div></div><div class="controls"><label class="pick">关联本地视频<input type="file" id="local" accept="video/*,.mkv,.avi,.mov"></label><label class="pick">载入字幕<input type="file" id="sub" accept=".srt,.vtt"></label><button id="shot" disabled>截图 PNG</button><button id="rotate">旋转 90°</button><button id="fit">填充：适应</button><button id="pip">画中画</button><button id="full">全屏</button></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><div class="controls"><button id="play">播放 / 暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>帧率 <input id="fps" type="number" min="1" max="240" value="30" aria-label="逐帧参考帧率"></label><select id="speed" aria-label="播放倍速"><option>.25</option><option>.5</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option><option>3</option></select><span id="clock" class="time">00:00.00 / —</span></div><div class="controls"><button id="a">设置 A</button><button id="b">设置 B</button><button id="loop" aria-pressed="false">A/B 循环：关闭</button><label>字幕偏移 / 秒 <input id="offset" type="number" step=".1" value="0"></label><button id="report">导出工程索引</button></div><small>逐帧按参考帧率定位，变帧率文件不保证解码帧精度。空格播放；←/→ 跳转 5 秒；,/. 逐帧。</small><p id="error" role="alert"></p><section id="project" hidden><h2>工程概览</h2><div class="metrics"><div><b id="tracks">0</b><span>轨道</span></div><div><b id="clips">0</b><span>片段</span></div><div><b id="assets">0</b><span>引用素材</span></div></div><div id="warnings"></div><h2>轨道与片段索引 · 非合成渲染</h2><div id="timeline"></div></section></main><aside><h2>媒体信息</h2><div id="details">尚未加载视频</div><h2>工程素材</h2><input id="search" type="search" placeholder="搜索名称或路径" aria-label="搜索工程素材"><div id="media"></div><h2>预览边界</h2><small>仅访问当前文件和允许的相对素材。绝对路径、远程地址及父目录不会自动打开。可手动关联本地视频，原文件保持只读。受 DRM 保护的媒体及剪辑软件私有特效不支持。</small></aside></div><script>/*BRIDGE*/</script><script>/*MODEL*/</script><script>/*PLAYER*/</script></html>
