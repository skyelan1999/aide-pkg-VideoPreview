</style><header><strong>VIDEO PREVIEW</strong><span id="format">工程与素材</span><span id="status" role="status">连接 Aide…</span></header><div class="layout"><main class="main"><div class="screen"><video id="video" playsinline controls hidden></video><div id="empty">选择工程素材或代理视频开始预览<br><small>工程结构预览不会执行剪辑软件的特效或脚本</small></div></div><div class="controls"><label class="pick">关联本地视频<input type="file" id="local" accept="video/*,.mkv,.avi,.mov"></label><label class="pick">载入字幕<input type="file" id="sub" accept=".srt,.vtt"></label><button id="shot" disabled>截图 PNG</button><button id="rotate">旋转 90°</button><button id="fit">填充：适应</button><button id="pip">画中画</button><button id="full">全屏</button></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><div class="controls"><button id="play">播放 / 暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>帧率 <input id="fps" type="number" min="1" max="240" value="30" aria-label="逐帧参考帧率"></label><select id="speed" aria-label="播放倍速"><option>.25</option><option>.5</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option><option>3</option></select><span id="clock" class="time">00:00.00 / —</span></div><div class="controls"><button id="a">设置 A</button><button id="b">设置 B</button><button id="loop" aria-pressed="false">A/B 循环：关闭</button><label>字幕偏移 / 秒 <input id="offset" type="number" step=".1" value="0"></label><button id="report">导出工程索引</button></div><small>逐帧按参考帧率定位，变帧率文件不保证解码帧精度。空格播放；←/→ 跳转 5 秒；,/. 逐帧。</small><p id="error" role="alert"></p><section id="project" hidden><h2>工程概览</h2><div class="metrics"><div><b id="tracks">0</b><span>轨道</span></div><div><b id="clips">0</b><span>片段</span></div><div><b id="assets">0</b><span>引用素材</span></div></div><div id="warnings"></div><h2>轨道与片段索引 · 非合成渲染</h2><div id="timeline"></div></section></main><aside><h2>媒体信息</h2><div id="details">尚未加载视频</div><h2>工程素材</h2><input id="search" type="search" placeholder="搜索名称或路径" aria-label="搜索工程素材"><div id="media"></div><h2>预览边界</h2><small>仅访问当前文件和允许的相对素材。绝对路径、远程地址及父目录不会自动打开。可手动关联本地视频，原文件保持只读。受 DRM 保护的媒体及剪辑软件私有特效不支持。</small></aside></div><script>'use strict';

(function(){
 function create(pluginId){
  if(typeof pluginId!=='string'||!/^[A-Za-z0-9_-]{1,64}$/.test(pluginId))throw Error('Invalid plugin id');
  let port=null,tools=[],capabilities=[],next=0,connecting=null,settle=null,closed=false;const pending=new Map(),listeners=new Set();

   port=e.ports[0];tools=m.tools.slice();capabilities=Array.isArray(m.capabilities)?m.capabilities.filter(x=>typeof x==='string').slice(0,16):[];port.onmessage=event=>{const value=event.data;if(value?.event==='scope.revoked'){revoke('Host scope revoked; verify effects before retry');for(const listener of listeners){try{listener(value);}catch(_){}}return;}if(value?.event){for(const listener of listeners)listener(value);return;}const p=pending.get(value?.requestId);if(!p)return;pending.delete(value.requestId);clearTimeout(p.timer);if(value.status==='error')p.reject(Error(value.error||'Host call failed'));else p.resolve(value);};port.start();clearTimeout(settle?.timer);settle?.resolve({protocol:1,tools:tools.slice(),capabilities:capabilities.slice()});settle=null;

   workflow:args=>request('workflow.control',{arguments:args}),
   capture:args=>request('capture.control',{arguments:args}),

   fileTarget:path=>request('file.target',{arguments:{path}}),
   saveFile:(path,content,hash)=>request('file.save',{arguments:{path,content,hash}}),

   async saveDocument(bytes,version){if(!(bytes instanceof Uint8Array))throw Error('Expected Uint8Array');await request('document.save.begin',{arguments:{size:bytes.byteLength,version}});for(let offset=0;offset<bytes.byteLength;offset+=524288){const chunk=bytes.subarray(offset,offset+524288);let binary='';for(let i=0;i<chunk.length;i+=8192)binary+=String.fromCharCode(...chunk.subarray(i,i+8192));await request('document.save.chunk',{arguments:{offset,data:btoa(binary)}});}return request('document.save.request',{arguments:{}});},
   async call(tool,args={},attachments=[]){await connect();if(!tools.includes(tool))throw Error('Tool not declared by this workbench');return request('tool.call',{tool,arguments:args,attachments});},proposalStatus:proposalId=>request('proposal.status',{proposalId}),onEvent(fn){listeners.add(fn);return()=>listeners.delete(fn);},close(){revoke('Client closed; verify effects before retry');}};

(function(root){
 function safeAsset(p){if(typeof p!=='string'||!p||p.length>4096||/^[a-z][a-z\d+.-]*:/i.test(p)||p.startsWith('/')||p.startsWith('\\')||p.includes('\\')||p.split('/').some(x=>!x||x==='.'||x==='..'))return null;return p;}
 function time(n){if(!Number.isFinite(n)||n<0)return '—';const h=Math.floor(n/3600),m=Math.floor(n/60)%60,s=(n%60).toFixed(2).padStart(5,'0');return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+s;}
 function srtToVtt(text){if(text.length>2*1048576)throw Error('字幕超过 2 MiB');const t=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');if(t.startsWith('WEBVTT'))return t;if(!/\d{2}:\d{2}:\d{2}[,.]\d{3}\s*-->/.test(t))throw Error('请选择 SRT 或 WebVTT 字幕');return 'WEBVTT\n\n'+t.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2');}
 root.VideoModel={safeAsset,time,srtToVtt};if(typeof module==='object')module.exports=root.VideoModel;
})(globalThis);
</script><script>'use strict';
const $=id=>document.getElementById(id),v=$('video'),M=VideoModel,client=AideWorkbenchClient.create('video-preview');
let chain=Promise.resolve(),closed=false,session='',project=null,currentUrl='',subtitleUrl='',rotation=0,fill=false,pointA=0,pointB=0,loop=false,subtitleOffset=0,cueTimes=[],generation=0;
const enqueue=fn=>{const p=chain.then(()=>{if(closed)throw Error('预览已关闭');return fn();});chain=p.catch(()=>{});return p;};
const io=async args=>(await enqueue(()=>client.call('video_preview_io',args))).result;
function notice(s){$('status').textContent=s;}function error(e){$('error').textContent=e.message||String(e);}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function download(blob,name){const u=URL.createObjectURL(blob),a=node('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);}
async function readAsset(asset,max,progress){const info=(await enqueue(()=>client.documentInfo(asset,{metadataOnly:true}))).result;if(!info.size||info.size>max)throw Error('文件为空或超过当前内存预览限制 '+Math.round(max/1048576)+' MiB');const parts=[];for(let offset=0;offset<info.size;){const item=(await enqueue(()=>client.readDocument({asset,offset,length:524288}))).result,b=Uint8Array.from(atob(item.data),c=>c.charCodeAt(0));if(!b.length||b.length>info.size-offset)throw Error('文件读取中断');parts.push(b);offset+=b.length;progress?.(offset,info.size);}const now=(await enqueue(()=>client.documentInfo(asset,{metadataOnly:true}))).result;if(now.size!==info.size)throw Error('文件大小在读取期间发生变化，请重新打开');return{info,parts};}
function detachSub(){if(subtitleUrl)URL.revokeObjectURL(subtitleUrl);subtitleUrl='';v.querySelectorAll('track').forEach(t=>t.remove());cueTimes=[];}
async function playBlob(blob,name){const ticket=++generation;v.pause();detachSub();if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(blob);v.src=currentUrl;v.hidden=false;$('empty').hidden=true;$('error').textContent='';rotation=0;v.style.transform='';pointA=pointB=0;loop=false;$('loop').textContent='A/B 循环：关闭';$('loop').setAttribute('aria-pressed','false');notice(name+' · 等待播放');v.load();return ticket;}
async function openMedia(path,name){try{const asset=M.safeAsset(path);if(!asset)throw Error('此素材是绝对路径、远程地址或父目录路径；请点击“关联本地视频”手动选择。');notice('读取素材…');const r=await readAsset(asset,128*1048576,(a,b)=>notice('读取素材 '+Math.round(a/b*100)+'%'));await playBlob(new Blob(r.parts,{type:mime(name)}),name);}catch(e){error(e);notice('素材未能读取');}}
function mime(name){const ext=name.toLowerCase().split('.').pop();return{mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm',ogv:'video/ogg'}[ext]||'application/octet-stream';}
function renderMedia(){const q=$('search').value.toLowerCase(),host=$('media');host.replaceChildren();for(const m of (project?.media||[]).filter(m=>(m.name+' '+m.path).toLowerCase().includes(q))){const b=node('button',m.name,'media');b.title=m.path;b.append(node('small',m.path));b.append(node('small',M.safeAsset(m.path)?'相对引用 · 点击检查并播放':'需手动关联 · 未验证'));b.onclick=()=>openMedia(m.path,m.name);host.append(b);}}
function renderProject(p){project=p;$('project').hidden=false;$('format').textContent=p.format;$('tracks').textContent=p.tracks.length;$('clips').textContent=p.tracks.reduce((n,t)=>n+t.clips.length,0);$('assets').textContent=p.media.length;$('warnings').replaceChildren(...p.warnings.map(w=>node('div',w,'warning')));const host=$('timeline');host.replaceChildren();for(const t of p.tracks){const row=node('div',undefined,'track');row.append(node('div',t.name+' · '+t.kind+' · '+t.clips.length+' 片段','track-title'));const lane=node('div',undefined,'lane');for(const c of t.clips){const b=node('button',c.name+' · '+M.time(c.duration),'clip '+t.kind);b.title='起点 '+M.time(c.start)+' / 时长 '+M.time(c.duration)+'\n'+c.source;b.onclick=()=>{if(c.source)void openMedia(c.source,c.name);else error(Error('此片段没有可直接播放的外部素材引用'));};lane.append(b);}row.append(lane);host.append(row);}if(p.entries)host.append(node('pre',p.entries.map(e=>e.name+' · '+e.size+' bytes').join('\n')));renderMedia();notice('工程索引完成 · 原文件只读');}
async function boot(){try{await client.connect();const info=(await enqueue(()=>client.documentInfo('',{metadataOnly:true}))).result,name=info.path||'file',ext=name.toLowerCase().split('.').pop();if(['mp4','m4v','mov','webm','mkv','avi','flv','ts','mts','m2ts','mpeg','mpg','ogv','3gp','wmv','vob'].includes(ext)){const r=await readAsset('',128*1048576,(a,b)=>notice('读取视频 '+Math.round(a/b*100)+'%'));await playBlob(new Blob(r.parts,{type:mime(name)}),name);return;}
 if(!info.size||info.size>16*1048576)throw Error('工程需为 1 字节至 16 MiB');session=(await io({action:'begin',size:info.size,name})).id;for(let offset=0;offset<info.size;){const item=(await enqueue(()=>client.readDocument({offset,length:48*1024}))).result;if(!item.data)throw Error('工程读取中断');const next=await io({action:'write',id:session,offset,data:item.data});offset=next.offset;notice('读取工程 '+Math.round(offset/info.size*100)+'%');}const id=session;session='';renderProject(await io({action:'inspect',id}));
 }catch(e){error(e);notice('未能打开');if(session){const id=session;session='';try{await io({action:'cancel',id});}catch(_){}}if((e.message||'').includes('该 JSON 不是'))try{await enqueue(()=>client.failDocumentPreview());}catch(_){}}}
v.onloadedmetadata=()=>{$('shot').disabled=false;$('details').textContent=v.videoWidth+' × '+v.videoHeight+'\n时长 '+M.time(v.duration)+'\n当前解码：浏览器原生\n原始编解码器/码率：浏览器未提供';notice('已就绪 · 点击播放');};v.onerror=()=>{error(Error('浏览器无法解码此媒体，或文件损坏。可关联已导出的 H.264/AAC MP4 代理。FFmpeg 兼容引擎仍在版权审计中，当前未提供下载。'));$('shot').disabled=true;};
v.ontimeupdate=()=>{if(loop&&pointB>pointA&&v.currentTime>=pointB)v.currentTime=pointA;$('clock').textContent=M.time(v.currentTime)+' / '+M.time(v.duration);$('seek').value=Number.isFinite(v.duration)&&v.duration>0?v.currentTime/v.duration*1000:0;};
const seek=t=>{if(Number.isFinite(v.duration))v.currentTime=Math.min(v.duration,Math.max(0,t));};const play=async()=>{if(!v.src)return;try{v.paused?await v.play():v.pause();}catch(e){error(e);}};const step=sign=>{v.pause();seek(v.currentTime+sign/Math.min(240,Math.max(1,Number($('fps').value)||30)));};
$('play').onclick=play;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('seek').oninput=()=>seek(v.duration*Number($('seek').value)/1000);$('speed').onchange=()=>v.playbackRate=Number($('speed').value);
$('a').onclick=()=>{pointA=v.currentTime;$('a').textContent='A '+M.time(pointA);};$('b').onclick=()=>{pointB=v.currentTime;$('b').textContent='B '+M.time(pointB);};$('loop').onclick=()=>{if(!(pointB>pointA)){error(Error('请先设置 B 大于 A 的循环区间'));return;}loop=!loop;$('loop').textContent='A/B 循环：'+(loop?'开启':'关闭');$('loop').setAttribute('aria-pressed',String(loop));if(loop)seek(pointA);};
$('rotate').onclick=()=>{rotation=(rotation+90)%360;v.style.transform='rotate('+rotation+'deg)';};$('fit').onclick=()=>{fill=!fill;v.style.objectFit=fill?'cover':'contain';$('fit').textContent='填充：'+(fill?'裁切':'适应');};$('full').onclick=async()=>{try{if(v.requestFullscreen)await v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();else throw Error('当前宿主未开放全屏能力');}catch(e){error(e);}};$('pip').onclick=async()=>{try{if(v.requestPictureInPicture)await v.requestPictureInPicture();else if(v.webkitSetPresentationMode)v.webkitSetPresentationMode('picture-in-picture');else throw Error('当前浏览器未提供画中画');}catch(e){error(e);}};
$('shot').onclick=()=>{try{if(!v.videoWidth||v.readyState<2)throw Error('请先加载一帧画面');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{if(b)download(b,'frame-'+v.currentTime.toFixed(3)+'.png');},'image/png');}catch(e){error(e);}};
$('local').onchange=async e=>{const f=e.target.files[0];if(f){if(f.size>512*1048576){error(Error('手动关联视频限制为 512 MiB'));return;}await playBlob(f,f.name);}e.target.value='';};
$('sub').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>2*1048576)throw Error('字幕超过 2 MiB');const text=M.srtToVtt(await f.text());detachSub();subtitleUrl=URL.createObjectURL(new Blob([text],{type:'text/vtt'}));const t=node('track');t.kind='subtitles';t.label=f.name;t.srclang='und';t.default=true;t.src=subtitleUrl;t.onload=()=>{t.track.mode='showing';cueTimes=Array.from(t.track.cues||[]).map(c=>({cue:c,start:c.startTime,end:c.endTime}));applyOffset();};v.append(t);}catch(e){error(e);}e.target.value='';};
function applyOffset(){subtitleOffset=Math.max(-3600,Math.min(3600,Number($('offset').value)||0));for(const x of cueTimes){x.cue.startTime=Math.max(0,x.start+subtitleOffset);x.cue.endTime=Math.max(x.cue.startTime+.001,x.end+subtitleOffset);}}$('offset').onchange=applyOffset;$('search').oninput=renderMedia;$('report').onclick=()=>{if(!project){error(Error('当前没有剪辑工程索引'));return;}download(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}),'project-index.json');};
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const actions={' ':play,ArrowLeft:()=>seek(v.currentTime-5),ArrowRight:()=>seek(v.currentTime+5),',':()=>step(-1),'.':()=>step(1)};if(actions[e.key]){e.preventDefault();actions[e.key]();}});
